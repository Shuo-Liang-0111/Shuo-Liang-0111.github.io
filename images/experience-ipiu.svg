<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">IPIU laboratory marker</title>
  <desc id="desc">A typographic marker for the IPIU Key Laboratory at Xidian University.</desc>
  <rect width="160" height="160" rx="18" fill="#f7f5ef"/>
  <rect x="8" y="8" width="144" height="144" rx="14" fill="none" stroke="#9b173c" stroke-width="4"/>
  <text x="80" y="79" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="2" fill="#9b173c">IPIU</text>
  <line x1="34" y1="94" x2="126" y2="94" stroke="#d8a0b1" stroke-width="2"/>
  <text x="80" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" letter-spacing="2.5" fill="#5f2638">XIDIAN</text>
</svg>
